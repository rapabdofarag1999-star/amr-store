<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مطبعة ع م ر - المتجر</title>
<meta name="theme-color" content="#120E1F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120E1F;
    --surface:#1C1730;
    --surface-2:#241D3D;
    --indigo:#6C5CE7;
    --violet:#9B59F6;
    --ink:#FF5C8A;
    --text:#F5F3FF;
    --muted:#A79FC2;
    --line:rgba(245,243,255,.09);
    --radius:18px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Arabic', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  body{
    padding-bottom:calc(76px + var(--safe-bottom));
    min-height:100vh;
  }
  h1,h2,h3,.brand,.price,.navlabel{font-family:'Cairo', system-ui, sans-serif;}
  ::selection{background:var(--violet); color:#fff;}
  button{font-family:inherit; cursor:pointer; border:none;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit; text-decoration:none;}
  img{display:block; max-width:100%;}

  .wrap{max-width:480px; margin:0 auto; position:relative;}

  /* Header */
  header.top{
    padding:18px 18px 14px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
  }
  .brandmark{display:flex; align-items:center; gap:10px;}
  .brandmark .logo{
    width:42px; height:42px; border-radius:12px;
    background:radial-gradient(circle at 30% 25%, var(--violet), var(--indigo) 65%);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px; color:#fff; flex-shrink:0;
    padding:5px; overflow:hidden;
  }
  .brandmark .logo img{width:100%; height:100%; object-fit:contain;}
  .brandmark .txt h1{font-size:17px; font-weight:800; letter-spacing:0;}
  .brandmark .txt span{font-size:11.5px; color:var(--muted);}
  .iconbtn{
    width:38px; height:38px; border-radius:11px;
    background:var(--surface); color:var(--text);
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line);
  }

  /* Hero */
  .hero{
    margin:4px 18px 20px;
    border-radius:22px;
    padding:26px 22px;
    position:relative; overflow:hidden;
    background:
      radial-gradient(120% 140% at 100% 0%, rgba(255,92,138,.35), transparent 55%),
      radial-gradient(120% 140% at -10% 100%, rgba(108,92,231,.55), transparent 60%),
      var(--surface);
    border:1px solid var(--line);
  }
  .hero .eyebrow{font-size:12.5px; color:var(--ink); font-weight:600; margin-bottom:8px;}
  .hero h2{font-size:23px; line-height:1.5; font-weight:800; max-width:15ch;}
  .hero p{font-size:13.5px; color:var(--muted); margin-top:10px; max-width:30ch; line-height:1.7;}
  .hero .cta{
    margin-top:16px; display:inline-flex; align-items:center; gap:8px;
    background:var(--text); color:var(--bg);
    padding:10px 18px; border-radius:100px; font-weight:700; font-size:13.5px;
  }

  /* Categories */
  .cats{
    display:flex; gap:8px; overflow-x:auto; padding:0 18px 16px;
    scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; padding:8px 16px; border-radius:100px;
    background:var(--surface); color:var(--muted); font-size:13px; font-weight:600;
    border:1px solid var(--line); white-space:nowrap;
  }
  .chip.active{background:var(--indigo); color:#fff; border-color:var(--indigo);}

  /* Search */
  .search{margin:0 18px 18px; position:relative;}
  .search input{
    width:100%; background:var(--surface); border:1px solid var(--line);
    color:var(--text); padding:12px 42px 12px 14px; border-radius:14px; font-size:14px;
  }
  .search input::placeholder{color:var(--muted);}
  .search svg{position:absolute; right:14px; top:50%; transform:translateY(-50%); opacity:.55;}

  /* Product grid */
  .grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
    padding:0 18px 24px;
  }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column;
  }
  .card .imgwrap{
    aspect-ratio:1/1; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .card .imgwrap img{width:100%; height:100%; object-fit:cover;}
  .card .imgwrap .ph{color:var(--muted); font-size:11px;}
  .badge{
    position:absolute; top:8px; right:8px;
    background:rgba(18,14,31,.75); backdrop-filter:blur(4px);
    color:var(--ink); font-size:10.5px; font-weight:700;
    padding:4px 9px; border-radius:100px;
  }
  .card .info{padding:11px 12px 13px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .card .name{font-size:13.5px; font-weight:600; line-height:1.4;}
  .card .meta{display:flex; align-items:center; justify-content:space-between; margin-top:auto;}
  .card .price{font-size:15px; font-weight:800; color:var(--text);}
  .card .price small{font-size:11px; color:var(--muted); font-weight:500;}
  .card .order{
    background:var(--indigo); color:#fff; width:32px; height:32px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }

  .empty{
    margin:30px 18px; text-align:center; color:var(--muted); font-size:13.5px;
    padding:30px 20px; border:1px dashed var(--line); border-radius:16px;
  }

  /* Bottom nav */
  nav.bottom{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    display:flex; justify-content:center;
    padding-bottom:var(--safe-bottom);
  }
  nav.bottom .inner{
    max-width:480px; width:100%; margin:0 12px 12px;
    background:rgba(28,23,48,.92); backdrop-filter:blur(14px);
    border:1px solid var(--line); border-radius:20px;
    display:flex; padding:8px;
  }
  nav.bottom button{
    flex:1; background:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:8px 4px; border-radius:14px; color:var(--muted);
  }
  nav.bottom button.active{color:#fff; background:var(--surface-2);}
  .navlabel{font-size:10.5px; font-weight:600;}

  /* Sections generic */
  .section-title{padding:6px 18px 12px; display:flex; align-items:center; justify-content:space-between;}
  .section-title h3{font-size:15px; font-weight:800;}

  /* Modal / sheet */
  .overlay{
    position:fixed; inset:0; background:rgba(6,4,14,.65);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
  }
  .overlay.show{display:flex;}
  .sheet{
    width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
    background:var(--bg); border-radius:24px 24px 0 0; border:1px solid var(--line); border-bottom:none;
    padding:20px 18px calc(24px + var(--safe-bottom));
    animation:up .22s ease-out;
  }
  @keyframes up{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet .handle{width:36px; height:4px; background:var(--line); border-radius:10px; margin:0 auto 16px;}
  .sheet h3{font-size:17px; font-weight:800; margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--surface); border:1px solid var(--line);
    color:var(--text); padding:11px 13px; border-radius:12px; font-size:14px;
  }
  .field textarea{resize:vertical; min-height:60px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .btn{
    width:100%; padding:13px; border-radius:14px; font-weight:700; font-size:14.5px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn.primary{background:linear-gradient(135deg, var(--indigo), var(--violet)); color:#fff;}
  .btn.ghost{background:var(--surface); color:var(--text); border:1px solid var(--line);}
  .btn.danger{background:rgba(255,92,138,.12); color:var(--ink);}
  .btnrow{display:flex; gap:10px; margin-top:16px;}
  .imgpick{
    display:flex; align-items:center; gap:12px; margin-bottom:14px;
  }
  .imgpick .prev{
    width:64px; height:64px; border-radius:14px; background:var(--surface);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    overflow:hidden; flex-shrink:0;
  }
  .imgpick .prev img{width:100%; height:100%; object-fit:cover;}
  .imgpick label.pickbtn{
    flex:1; background:var(--surface); border:1px dashed var(--line); border-radius:12px;
    padding:11px; text-align:center; font-size:12.5px; color:var(--muted); font-weight:600;
  }

  /* Admin list rows */
  .adm-row{
    display:flex; align-items:center; gap:12px; padding:11px; background:var(--surface);
    border:1px solid var(--line); border-radius:16px; margin-bottom:9px;
  }
  .adm-row .thumb{
    width:48px; height:48px; border-radius:10px; background:var(--surface-2); flex-shrink:0; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .adm-row .thumb img{width:100%; height:100%; object-fit:cover;}
  .adm-row .txt{flex:1; min-width:0;}
  .adm-row .txt .n{font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .adm-row .txt .p{font-size:12px; color:var(--muted); margin-top:2px;}
  .adm-row .acts{display:flex; gap:6px;}
  .adm-row .acts button{
    width:32px; height:32px; border-radius:9px; background:var(--surface-2); color:var(--text);
    display:flex; align-items:center; justify-content:center;
  }
  .switch{
    width:40px; height:24px; border-radius:100px; background:var(--surface-2); position:relative; flex-shrink:0;
    border:1px solid var(--line);
  }
  .switch.on{background:var(--indigo);}
  .switch .dot{
    position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:#fff;
    transition:transform .15s;
  }
  .switch.on .dot{transform:translateX(-16px);}

  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
    background:var(--surface-2); color:var(--text); padding:11px 20px; border-radius:100px;
    font-size:13px; font-weight:600; border:1px solid var(--line); z-index:60;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .lockscreen{
    padding:60px 24px; text-align:center;
  }
  .lockscreen .lockicon{
    width:56px; height:56px; border-radius:16px; margin:0 auto 18px;
    background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--muted);
  }
  .lockscreen h3{font-size:16px; margin-bottom:6px;}
  .lockscreen p{font-size:13px; color:var(--muted); margin-bottom:20px;}

  .empty-admin{text-align:center; color:var(--muted); font-size:13px; padding:30px 10px;}


  /* ===== CUSTOMER PORTAL ===== */
  .portal-header{
    text-align:center; padding:30px 18px 20px;
  }
  .portal-avatar{
    width:72px; height:72px; border-radius:50%;
    background:linear-gradient(135deg,var(--indigo),var(--violet));
    color:#fff; font-size:28px; font-weight:900;
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 14px;
    box-shadow:0 8px 24px rgba(108,92,231,.4);
  }
  .portal-name{font-size:20px; font-weight:800; margin-bottom:4px;}
  .portal-phone{font-size:13px; color:var(--muted);}
  .stat-row{
    display:grid; grid-template-columns:1fr 1fr;
    gap:10px; padding:0 18px 18px;
  }
  .stat-box{
    background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:14px 16px; text-align:center;
  }
  .stat-box .sv{font-size:22px; font-weight:900; line-height:1.2;}
  .stat-box .sl{font-size:11px; color:var(--muted); margin-top:4px;}
  .order-card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:14px 16px; margin-bottom:10px;
  }
  .order-card .oc-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;}
  .order-card .oc-num{font-size:12px; color:var(--muted); font-weight:700;}
  .order-card .oc-title{font-size:14px; font-weight:700; flex:1; margin:0 8px;}
  .order-card .oc-status{
    font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:999px; flex-shrink:0;
  }
  .st-pending{background:rgba(245,158,11,.15); color:#d97706;}
  .st-ready{background:rgba(34,197,94,.15); color:#16a34a;}
  .st-done{background:rgba(99,102,241,.15); color:#6366f1;}
  .st-cancelled{background:rgba(239,68,68,.15); color:#dc2626;}
  .order-card .oc-row{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:4px;}
  .order-card .oc-row span:last-child{color:var(--text); font-weight:600;}
  .order-card .oc-debt{
    margin-top:10px; padding-top:10px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .order-card .oc-debt .dl{font-size:12px; color:var(--muted);}
  .order-card .oc-debt .dv{font-size:16px; font-weight:900; color:#ef4444;}
  .order-card .oc-debt .dv.paid{color:#22c55e;}
  .portal-empty{text-align:center; color:var(--muted); font-size:13px; padding:30px 18px; line-height:1.8;}
  .portal-login{padding:30px 18px;}
  .portal-login .pl-icon{
    width:64px; height:64px; border-radius:20px; margin:0 auto 18px;
    background:linear-gradient(135deg,var(--indigo),var(--violet));
    display:flex; align-items:center; justify-content:center;
    font-size:28px; box-shadow:0 8px 24px rgba(108,92,231,.4);
  }
  .portal-login h3{font-size:18px; font-weight:800; text-align:center; margin-bottom:6px;}
  .portal-login p{font-size:13px; color:var(--muted); text-align:center; margin-bottom:22px; line-height:1.7;}
  .debt-banner{
    margin:0 18px 14px;
    background:linear-gradient(135deg,rgba(239,68,68,.15),rgba(239,68,68,.05));
    border:1px solid rgba(239,68,68,.25);
    border-radius:14px; padding:14px 16px;
    display:flex; align-items:center; gap:12px;
  }
  .debt-banner .di{font-size:24px; flex-shrink:0;}
  .debt-banner .dt{font-size:11px; color:var(--muted);}
  .debt-banner .dv{font-size:20px; font-weight:900; color:#ef4444;}
  .fab{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(88px + var(--safe-bottom));
    z-index:25;
    display:flex; align-items:center; gap:8px;
    background:linear-gradient(135deg, var(--indigo), var(--violet));
    color:#fff; padding:12px 20px; border-radius:100px;
    font-weight:700; font-size:13.5px;
    box-shadow:0 8px 24px rgba(108,92,231,.4);
    max-width:calc(480px - 36px);
  }
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<div class="overlay" id="overlay"><div class="sheet" id="sheetContent"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ DATA LAYER ============ */
const STORE_KEY = "amrStoreData_v1";
const ADMIN_KEY = "amrStoreAdminAuth";

const DEFAULT_DATA = {
  settings:{
    shopName:"مطبعة ع م ر",
    tagline:"طباعة DTF، سبليميشن وسيلك سكرين",
    whatsapp:"", // e.g. "201001234567" - owner sets this in admin
    heroTitle:"صمم طلبك، إحنا نطبعه",
    heroText:"تيشيرتات، هوديز، مج وستيكرز — بالمقاس والتصميم اللي إنت عايزه"
  },
  categories:["الكل","تيشيرتات","هوديز","كاباتير","مج","ستيكرز"],
  products:[
    {id:"p1", name:"تيشيرت طباعة DTF", price:"100", note:"من 100 جنيه حسب المقاس", category:"تيشيرتات", img:"", active:true},
    {id:"p2", name:"هودي مطبوع", price:"280", note:"", category:"هوديز", img:"", active:true},
    {id:"p3", name:"كاب مطرز/مطبوع", price:"90", note:"", category:"كاباتير", img:"", active:true},
    {id:"p4", name:"مج سبليميشن", price:"55", note:"", category:"مج", img:"", active:true},
    {id:"p5", name:"استيكرز مقصوصة", price:"5", note:"للقطعة، حسب الكمية", category:"ستيكرز", img:"", active:true},
    {id:"p6", name:"تصميم مخصص - اطلب استشارة", price:"", note:"ابعتلنا فكرتك وهنسعّرهالك", category:"تيشيرتات", img:"", active:true}
  ]
};

function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw){ localStorage.setItem(STORE_KEY, JSON.stringify(DEFAULT_DATA)); return structuredClone(DEFAULT_DATA); }
    return JSON.parse(raw);
  }catch(e){ return structuredClone(DEFAULT_DATA); }
}

/* ============ RENDER: HOME ============ */
function renderHome(){
  const cats = DATA.categories;
  let products = DATA.products.filter(p=>p.active!==false);
  if(STATE.cat !== "الكل") products = products.filter(p=>p.category===STATE.cat);
  if(STATE.q.trim()) products = products.filter(p=>p.name.includes(STATE.q.trim()));

  return `
    <header class="top">
      <div class="brandmark">
        <div class="logo"><img src="${LOGO_IMG}" alt="لوجو"></div>
        <div class="txt">
          <h1>${DATA.settings.shopName}</h1>
          <span>${DATA.settings.tagline}</span>
        </div>
      </div>
      <button class="iconbtn" onclick="openAdminGate()">${ICONS.gear}</button>
    </header>

    <div class="hero">
      <div class="eyebrow">اطلب دلوقتي</div>
      <h2>${DATA.settings.heroTitle}</h2>
      <p>${DATA.settings.heroText}</p>
      <div class="cta" onclick="document.querySelector('.grid')?.scrollIntoView({behavior:'smooth'})" style="cursor:pointer;">${ICONS.grid} تصفح المنتجات</div>
    </div>

    <div class="search">
      ${ICONS.search}
      <input placeholder="دور على منتج..." value="${STATE.q}" oninput="STATE.q=this.value; renderApp()">
    </div>

    <div class="cats">
      ${cats.map(c=>`<button class="chip ${c===STATE.cat?'active':''}" onclick="STATE.cat='${c.replace(/'/g,"\\'")}'; renderApp()">${c}</button>`).join("")}
    </div>

    <div class="section-title"><h3>المنتجات</h3></div>

    ${products.length? `<div class="grid">${products.map(productCard).join("")}</div>` :
      `<div class="empty">مفيش منتجات في القسم ده لسه</div>`}

    <button class="fab" onclick="quickAddProduct()">${ICONS.plus} إضافة منتج</button>
  `;
}

function quickAddProduct(){
  if(STATE.adminUnlocked){ openProductForm(); }
  else {
    showSheet(`
      <div class="handle"></div>
      <div class="lockscreen">
        <div class="lockicon">${ICONS.lock}</div>
        <h3>دخول الإدارة</h3>
        <p>سجل دخولك الأول عشان تضيف منتجات</p>
        <div class="field"><input id="admUser" placeholder="اسم المستخدم" autocomplete="off"></div>
        <div class="field"><input id="admPass" type="password" placeholder="كلمة المرور" autocomplete="off"></div>
        <button class="btn primary" onclick="tryAdminLoginThenAdd()">دخول وإضافة</button>
      </div>
    `);
  }
}

function tryAdminLoginThenAdd(){
  const u = document.getElementById("admUser").value.trim();
  const p = document.getElementById("admPass").value.trim();
  if(u==="boda" && p==="5799"){
    STATE.adminUnlocked = true;
    sessionStorage.setItem(ADMIN_KEY,"1");
    openProductForm();
  } else {
    toast("بيانات غلط");
  }
}

function productCard(p){
  const imgHtml = p.img ? `<img src="${p.img}" alt="${p.name}">` : `<span class="ph">${p.category||"منتج"}</span>`;

function saveSettings(){
  DATA.settings.shopName = document.getElementById("setShopName").value.trim() || DATA.settings.shopName;
  DATA.settings.tagline = document.getElementById("setTagline").value.trim();

}

function exportBackup(){
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "amr-store-backup.json";
  a.click();
}
function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.products || !parsed.categories) throw new Error("bad file");
      DATA = parsed;
      saveData(DATA);
      renderApp();
      toast("اترفعت النسخة الاحتياطية ✅");
    }catch(err){ toast("الملف مش صالح"); }
  };
  reader.readAsText(file);
}

function openProductForm(id){
  STATE.editingId = id || null;
  const p = id ? DATA.products.find(x=>x.id===id) : {name:"",price:"",note:"",category:DATA.categories[1]||"",img:"",active:true};
  const cats = DATA.categories.filter(c=>c!=="الكل");
  showSheet(`
    <div class="handle"></div>
    <h3>${id? "تعديل المنتج":"منتج جديد"}</h3>
    <div class="imgpick">
      <div class="prev" id="imgPreview">${p.img?`<img src="${p.img}">`:""}</div>
      <label class="pickbtn">
        اختار صورة
        <input type="file" accept="image/*" style="display:none" onchange="handleImagePick(event)">
      </label>
    </div>
    <div class="field"><label>اسم المنتج</label><input id="pfName" value="${p.name||""}" placeholder="مثال: تيشيرت DTF"></div>
    <div class="row2">
      <div class="field"><label>السعر (اختياري)</label><input id="pfPrice" value="${p.price||""}" placeholder="مثال: 100" inputmode="numeric"></div>
      <div class="field"><label>الفئة</label>
        <select id="pfCategory">${cats.map(c=>`<option value="${c}" ${c===p.category?'selected':''}>${c}</option>`).join("")}</select>
      </div>
    </div>
    <div class="field"><label>ملاحظة (تظهر تحت الاسم)</label><input id="pfNote" value="${p.note||""}" placeholder="مثال: حسب المقاس"></div>
    <div class="btnrow">
      <button class="btn primary" onclick="saveProductForm()">حفظ</button>
      <button class="btn ghost" onclick="closeSheet()">إلغاء</button>
    </div>
  `);
  window._tempImg = p.img || "";
}

function handleImagePick(e){
  const file = e.target.files[0];
  if(!file) return;
  if(file.size > 1.5*1024*1024){ toast("الصورة كبيرة، اختار صورة أصغر من 1.5 ميجا"); return; }
  const reader = new FileReader();
  reader.onload = () => {
    window._tempImg = reader.result;
    document.getElementById("imgPreview").innerHTML = `<img src="${reader.result}">`;
  };
  reader.readAsDataURL(file);
}

function saveProductForm(){
  const name = document.getElementById("pfName").value.trim();
  if(!name){ toast("لازم تكتب اسم المنتج"); return; }
  const price = document.getElementById("pfPrice").value.trim();
  const category = document.getElementById("pfCategory").value;
  const note = document.getElementById("pfNote").value.trim();
  const img = window._tempImg || "";

  if(STATE.editingId){
    const p = DATA.products.find(x=>x.id===STATE.editingId);
    Object.assign(p, {name, price, category, note, img});
  } else {
    DATA.products.push({id:uid(), name, price, category, note, img, active:true});
  }
  saveData(DATA);
  closeSheet();
  renderApp();
  toast("اتحفظ ✅");
}

const PORTAL_KEY = "amrPortalCustomer_v1";

function getPortalCustomer(){
  try{ return JSON.parse(sessionStorage.getItem(PORTAL_KEY)||"null"); }
  catch(e){ return null; }
}
function setPortalCustomer(c){
  sessionStorage.setItem(PORTAL_KEY, JSON.stringify(c));
}

  sessionStorage.removeItem(PORTAL_KEY);
}

// Get orders from the main system's localStorage (shared storage)
function getSystemData(){
  try{
    const raw = localStorage.getItem("businessSystemFinalEditDelete");
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

function portalLogin(){
  const phone = (document.getElementById("portalPhone")||{}).value;
  const name  = (document.getElementById("portalName")||{}).value;
  if(!phone || phone.trim().length < 7){ toast("ادخل رقم الموبايل صح"); return; }

  const sys = getSystemData();
  if(!sys || !sys.customers){
    toast("مش لاقي بيانات — تأكد إن النظام شغال");
    return;
  }

  // Match by phone (normalize: strip spaces, leading zeros)
  const norm = p => p.replace(/[^0-9]/g,"").replace(/^0+/,"");
  const entered = norm(phone.trim());
  const cust = sys.customers.find(c => {
    const cp = norm(c.phone||"");
    return cp && (cp === entered || cp.endsWith(entered) || entered.endsWith(cp));
  });

  if(!cust){ toast("مش لاقيك في النظام — تواصل مع المطبعة"); return; }

  setPortalCustomer({id: cust.id, name: cust.name, phone: cust.phone});
  STATE.tab = "portal";
  renderApp();
  toast("أهلاً " + cust.name + " 👋");
}

      <div>
        <div class="dt">إجمالي المديونية</div>
        <div class="dv">${fmt(totalDebt)} جنيه</div>
      </div>
    </div>` : `
    <div class="debt-banner" style="background:rgba(34,197,94,.1); border-color:rgba(34,197,94,.2);">
      <div class="di">✅</div>
      <div>
        <div class="dt">حالة الحساب</div>
        <div class="dv" style="color:#16a34a; font-size:15px;">مش عليك حاجة 🎉</div>
      </div>
    </div>`;

  const ordersHtml = orders.length ? orders.map(o => {
    const remain = Math.max((+o.total||0)-(+o.paid||0), 0);
    return `
      <div class="order-card">
        <div class="oc-top">
          <div class="oc-num">${o.invoiceNo||"#"}</div>
          <div class="oc-title">${o.title||"-"}</div>
          <div class="oc-status ${statusClass(o.status)}">${statusLabel(o.status)}</div>
        </div>
        <div class="oc-row"><span>التاريخ</span><span>${o.date||"-"}</span></div>
        <div class="oc-row"><span>الكمية</span><span>${o.qty||1} قطعة</span></div>
        <div class="oc-row"><span>الإجمالي</span><span>${fmt(o.total)} جنيه</span></div>
        <div class="oc-row"><span>المدفوع</span><span>${fmt(o.paid)} جنيه</span></div>
        ${o.notes ? `<div style="margin-top:8px; font-size:11.5px; color:var(--muted); line-height:1.6; padding-top:8px; border-top:1px solid var(--line);">${o.notes}</div>` : ""}
        <div class="oc-debt">
          <div class="dl">المتبقي</div>
          <div class="dv ${remain===0?'paid':''}">${remain===0 ? "مسدد ✅" : fmt(remain)+" جنيه"}</div>
        </div>
      </div>
    `;
  }).join("") : `<div class="portal-empty">مفيش طلبات لحد دلوقتي 📦<br>لما تعمل أي طلب هيظهر هنا</div>`;

  return `
    <header class="top">
      <div class="brandmark">
        <div class="logo"><img src="${LOGO_IMG}" alt="لوجو"></div>
        <div class="txt"><h1>حسابي</h1><span>طلباتك وفواتيرك</span></div>
      </div>
      <button class="iconbtn" onclick="clearPortalCustomer(); STATE.tab='portal'; renderApp();" title="خروج">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </header>

    <div class="portal-header">
      <div class="portal-avatar">${(cust.name||"?")[0]}</div>
      <div class="portal-name">${cust.name}</div>
      <div class="portal-phone">${cust.phone||""}</div>
    </div>

    <div class="stat-row">
      <div class="stat-box"><div class="sv">${orders.length}</div><div class="sl">إجمالي الطلبات</div></div>
      <div class="stat-box"><div class="sv" style="color:#ef4444;">${fmt(totalDebt)}</div><div class="sl">المديونية (جنيه)</div></div>
      <div class="stat-box"><div class="sv" style="color:#22c55e;">${fmt(totalPaid)}</div><div class="sl">المدفوع (جنيه)</div></div>
      <div class="stat-box"><div class="sv">${fmt(totalVal)}</div><div class="sl">إجمالي القيمة</div></div>
    </div>

    ${debtBanner}

    <div style="padding:0 18px 6px; display:flex; justify-content:space-between; align-items:center;">
      <h3 style="font-size:15px; font-weight:800;">الطلبات (${orders.length})</h3>
    </div>
    <div style="padding:0 18px 30px;">
      ${ordersHtml}
    </div>
  `;
}

/* ============ APP RENDER ============ */
function renderApp(){
  const app = document.getElementById("app");
  let body = "";
  if(STATE.tab==="home") body = renderHome();
  else if(STATE.tab==="cats") body = renderCatsTab();
  else if(STATE.tab==="contact") body = renderContactTab();
  else if(STATE.tab==="admin") body = renderAdmin();
  else if(STATE.tab==="portal") body = renderPortal();
  app.innerHTML = body + (STATE.tab!=="admin" ? renderNav() : "");
  window.scrollTo(0,0);
}

renderApp();

/* ============ SERVICE WORKER ============ */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
